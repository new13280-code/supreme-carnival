    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ot-calculator-2026';
        let db = null;
        let auth = null;
        let currentUser = null;

        try {
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            }
        } catch (e) {
            console.warn("Firebase config error:", e);
        }

        window.OTStorage = {
            isAvailable: () => Boolean(auth && db),

            init: async (onUserReady) => {
                if (!auth || !db) return () => {};
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    try {
                        await signInAnonymously(auth);
                    } catch (e) {
                        console.warn("Firebase sign-in unavailable; using local storage.", e);
                    }
                }

                // Return an explicit cleanup function so React can unsubscribe correctly.
                return onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        onUserReady(user);
                    }
                });
            },

            subscribeData: (onData) => {
                if (!db || !currentUser) return () => {};
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'ot_data', 'user_profile');
                return onSnapshot(userDocRef, (docSnap) => {
                    // Notify even when the cloud document does not exist, so loading can finish.
                    onData(docSnap.exists() ? docSnap.data() : null);
                }, (error) => {
                    console.error("Firestore sync error:", error);
                    onData(null);
                });
            },

            saveData: async (data) => {
                if (!db || !currentUser) return false;
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'ot_data', 'user_profile');
                    await setDoc(userDocRef, data, { merge: true });
                    return true;
                } catch (error) {
                    console.error("Firestore save error:", error);
                    return false;
                }
            }
        };
    </script>

<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const THAI_HOLIDAYS_2026 = {
            '2026-01-01': 'วันขึ้นปีใหม่',
            '2026-03-03': 'วันมาฆบูชา',

            '2026-04-14': 'วันสงกรานต์',
            '2026-04-15': 'วันสงกรานต์',
            '2026-05-01': 'วันแรงงานแห่งชาติ',
            '2026-05-04': 'วันฉัตรมงคล',
            '2026-05-31': 'วันวิสาขบูชา',
            '2026-06-01': 'ชดเชยวันวิสาขบูชา',
            '2026-06-03': 'วันเฉลิมพระชนมพรรษา สมเด็จพระนางเจ้าฯ พระบรมราชินี',
            '2026-07-28': 'วันเฉลิมพระชนมพรรษา พระบาทสมเด็จพระเจ้าอยู่หัว',
            '2026-07-29': 'วันอาสาฬหบูชา',
            '2026-08-12': 'วันแม่แห่งชาติ',
            '2026-10-13': 'วันนวมินทรมหาราช',
            '2026-10-23': 'วันปิยมหาราช',
            '2026-12-05': 'วันพ่อแห่งชาติ / วันชาติ',
            '2026-12-10': 'วันรัฐธรรมนูญ',
            '2026-12-31': 'วันสิ้นปี',
            // เพิ่มตัวอย่างวันหยุดปี 2027 เพื่อเป็นค่าเริ่มต้นสำหรับปีถัดไป
            '2027-01-01': 'วันขึ้นปีใหม่',
            '2027-04-13': 'วันสงกรานต์',
            '2027-04-14': 'วันสงกรานต์',
            '2027-04-15': 'วันสงกรานต์',
            '2027-05-01': 'วันแรงงานแห่งชาติ',
            '2027-07-28': 'วันเฉลิมพระชนมพรรษา พระบาทสมเด็จพระเจ้าอยู่หัว',
            '2027-08-12': 'วันแม่แห่งชาติ',
            '2027-10-13': 'วันนวมินทรมหาราช',
            '2027-10-23': 'วันปิยมหาราช',
            '2027-12-05': 'วันพ่อแห่งชาติ / วันชาติ',
            '2027-12-10': 'วันรัฐธรรมนูญ',
            '2027-12-31': 'วันสิ้นปี'
        };

        const MONTH_NAMES_TH = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];

        const DAY_NAMES_TH = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

        const DEFAULT_SETTINGS = {
            baseDailyHours: 9,
            daysInMonth: 30,
            otWarningThreshold: 80,
            enableOtWarning: true,
            cycleStartDay: 25,
            cycleEndDay: 24,
            preset1: 9,
            preset2: 10.5,
            preset3: 11.5
        };

        const OT_LOCAL_STORAGE_KEY = 'ot-calculator-2026-data';

        function OTCalculatorApp() {
            const [salary, setSalary] = React.useState(23400);
            const [selectedYear, setSelectedYear] = React.useState(2026);
            const [selectedCycleMonth, setSelectedCycleMonth] = React.useState(10);
            const [workHours, setWorkHours] = React.useState({});
            const [customHolidays, setCustomHolidays] = React.useState(THAI_HOLIDAYS_2026);
            const [settings, setSettings] = React.useState(DEFAULT_SETTINGS);
            
            // Persistence & Sync States
            const [isLoaded, setIsLoaded] = React.useState(false);
            const [saveStatus, setSaveStatus] = React.useState('ready');
            const [isCloudEnabled, setIsCloudEnabled] = React.useState(false);
            const [isCloudReady, setIsCloudReady] = React.useState(false);

            // UI View & Modal States
            const [viewMode, setViewMode] = React.useState(() => {
                return window.innerWidth < 768 ? 'mobile-cards' : 'calendar';
            });
            const [showHolidayModal, setShowHolidayModal] = React.useState(false);
            const [showSettingsModal, setShowSettingsModal] = React.useState(false);
            const [show80HourWarningModal, setShow80HourWarningModal] = React.useState(false);
            const [showPrintSlipModal, setShowPrintSlipModal] = React.useState(false);
            const [hasTriggered80HrModal, setHasTriggered80HrModal] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState('');

            React.useEffect(() => {
                let cancelled = false;
                let unsubscribeAuth = () => {};
                let unsubscribeData = () => {};

                // Restore local data first, so the app remains usable without Firebase.
                try {
                    const raw = window.localStorage.getItem(OT_LOCAL_STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data && typeof data === 'object') {
                            if (data.salary !== undefined) setSalary(data.salary);
                            if (data.selectedYear !== undefined) setSelectedYear(data.selectedYear);
                            if (data.selectedCycleMonth !== undefined) setSelectedCycleMonth(data.selectedCycleMonth);
                            if (data.workHours && typeof data.workHours === 'object') setWorkHours(data.workHours);
                            if (data.customHolidays && typeof data.customHolidays === 'object') setCustomHolidays(data.customHolidays);
                            if (data.settings && typeof data.settings === 'object') setSettings(prev => ({ ...prev, ...data.settings }));
                        }
                    }
                } catch (error) {
                    console.warn('Could not restore local OT data:', error);
                }

                if (!window.OTStorage || !window.OTStorage.isAvailable()) {
                    setIsLoaded(true);
                    setSaveStatus('local');
                } else {
                    Promise.resolve(window.OTStorage.init(() => {
                        if (cancelled) return;
                        setIsCloudEnabled(true);
                        unsubscribeData = window.OTStorage.subscribeData((data) => {
                            if (cancelled) return;
                            if (data) {
                                if (data.salary !== undefined) setSalary(data.salary);
                                if (data.selectedYear !== undefined) setSelectedYear(data.selectedYear);
                                if (data.selectedCycleMonth !== undefined) setSelectedCycleMonth(data.selectedCycleMonth);
                                if (data.workHours && typeof data.workHours === 'object') setWorkHours(data.workHours);
                                if (data.customHolidays && typeof data.customHolidays === 'object') setCustomHolidays(data.customHolidays);
                                if (data.settings && typeof data.settings === 'object') setSettings(prev => ({ ...prev, ...data.settings }));
                            }
                            setIsCloudReady(true);
                            setIsLoaded(true);
                            setSaveStatus(data ? 'saved' : 'local');
                        });
                    })).then((stop) => {
                        unsubscribeAuth = typeof stop === 'function' ? stop : () => {};
                        if (cancelled) unsubscribeAuth();
                    }).catch((error) => {
                        console.warn('Firebase initialization failed; using local storage.', error);
                        if (!cancelled) {
                            setIsLoaded(true);
                            setSaveStatus('local');
                        }
                    });
                }

                return () => {
                    cancelled = true;
                    unsubscribeData();
                    unsubscribeAuth();
                };
            }, []);

            // Always save locally; cloud sync is an optional second copy.
            React.useEffect(() => {
                if (!isLoaded) return;
                const data = {
                    salary,
                    selectedYear,
                    selectedCycleMonth,
                    workHours,
                    customHolidays,
                    settings,
                    updatedAt: new Date().toISOString()
                };
                try {
                    window.localStorage.setItem(OT_LOCAL_STORAGE_KEY, JSON.stringify(data));
                    if (!isCloudEnabled) setSaveStatus('local');
                } catch (error) {
                    console.error('Local OT save failed:', error);
                    setSaveStatus('error');
                }
            }, [salary, selectedYear, selectedCycleMonth, workHours, customHolidays, settings, isLoaded, isCloudEnabled]);

            React.useEffect(() => {
                if (!isLoaded || !isCloudEnabled || !isCloudReady) return;

                setSaveStatus('saving');
                const timer = setTimeout(async () => {
                    const success = await window.OTStorage.saveData({
                        salary,
                        selectedYear,
                        selectedCycleMonth,
                        workHours,
                        customHolidays,
                        settings,
                        updatedAt: new Date().toISOString()
                    });
                    setSaveStatus(success ? 'saved' : 'local');
                }, 600);

                return () => clearTimeout(timer);
            }, [salary, selectedYear, selectedCycleMonth, workHours, customHolidays, settings, isLoaded, isCloudEnabled, isCloudReady]);

            const hourlyRate = React.useMemo(() => {
                const s = Number(salary);
                const days = Number(settings.daysInMonth);
                const hrs = Number(settings.baseDailyHours);

                if (
                    !Number.isFinite(s) || s < 0 ||
                    !Number.isFinite(days) || days <= 0 ||
                    !Number.isFinite(hrs) || hrs <= 0
                ) {
                    return 0;
                }

                return s / days / hrs;
            }, [salary, settings.daysInMonth, settings.baseDailyHours]);

            const cycleDates = React.useMemo(() => {
                const dates = [];

                const toValidDay = (value, fallback) => {
                    const n = Number(value);
                    return Number.isFinite(n)
                        ? Math.max(1, Math.min(31, Math.trunc(n)))
                        : fallback;
                };

                const startDay = toValidDay(settings.cycleStartDay, 25);
                const endDay = toValidDay(settings.cycleEndDay, 24);

                // selectedCycleMonth เป็น 1–12
                const endMonthIndex = selectedCycleMonth - 1;
                const startMonthDate = new Date(
                    selectedYear,
                    endMonthIndex - 1,
                    1
                );

                const endMonthDate = new Date(
                    selectedYear,
                    endMonthIndex,
                    1
                );

                // จำกัดวันที่ให้ไม่เกินวันสุดท้ายของเดือนนั้น
                const makeClampedDate = (year, monthIndex, day) => {
                    const lastDay = new Date(year, monthIndex + 1, 0).getDate();
                    return new Date(year, monthIndex, Math.min(day, lastDay));
                };

                const startDate = makeClampedDate(
                    startMonthDate.getFullYear(),
                    startMonthDate.getMonth(),
                    startDay
                );

                const endDate = makeClampedDate(
                    endMonthDate.getFullYear(),
                    endMonthDate.getMonth(),
                    endDay
                );

                // ป้องกันการสร้างรอบที่ไม่ถูกต้อง
                if (startDate > endDate) return dates;

                const curr = new Date(startDate);

                while (curr <= endDate) {
                    const y = curr.getFullYear();
                    const m = String(curr.getMonth() + 1).padStart(2, '0');
                    const d = String(curr.getDate()).padStart(2, '0');
                    const dateStr = `${y}-${m}-${d}`;
                    const dayOfWeek = curr.getDay();
                    const holidayName = customHolidays[dateStr] || null;

                    let dayType = 'weekday';

                    if (holidayName) {
                        dayType = 'holiday';
                    } else if (dayOfWeek === 0) {
                        dayType = 'sunday';
                    } else if (dayOfWeek === 6) {
                        dayType = 'saturday';
                    }

                    dates.push({
                        dateStr,
                        dateObj: new Date(curr),
                        dayNum: curr.getDate(),
                        dayOfWeek,
                        dayName: DAY_NAMES_TH[dayOfWeek],
                        dayType,
                        holidayName
                    });

                    curr.setDate(curr.getDate() + 1);
                }

                return dates;
            }, [
                selectedYear,
                selectedCycleMonth,
                customHolidays,
                settings.cycleStartDay,
                settings.cycleEndDay
            ]);

            const dailyCalculations = React.useMemo(() => {
                let cumulativeOtSoFar = 0;
                const baseHrs = parseFloat(settings.baseDailyHours) || 9;
                const threshold = parseFloat(settings.otWarningThreshold) || 80;

                return cycleDates.map(item => {
                    const hrs = parseFloat(workHours[item.dateStr]) || 0;
                    let ot1_0 = 0;
                    let ot1_5 = 0;
                    let ot2_0 = 0;
                    let ot3_0 = 0;

                    if (hrs > 0) {
                        if (item.dayType === 'weekday') {
                            if (hrs > baseHrs) {
                                ot1_5 = hrs - baseHrs;
                            }
                        } else if (item.dayType === 'saturday' || item.dayType === 'sunday') {
                            ot1_0 = Math.min(hrs, baseHrs);
                            if (hrs > baseHrs) {
                                ot3_0 = hrs - baseHrs;
                            }
                        } else if (item.dayType === 'holiday') {
                            ot2_0 = Math.min(hrs, baseHrs);
                            if (hrs > baseHrs) {
                                ot3_0 = hrs - baseHrs;
                            }
                        }
                    }

                    const pay1_0 = ot1_0 * hourlyRate * 1.0;
                    const pay1_5 = ot1_5 * hourlyRate * 1.5;
                    const pay2_0 = ot2_0 * hourlyRate * 2.0;
                    const pay3_0 = ot3_0 * hourlyRate * 3.0;
                    const totalOtPay = pay1_0 + pay1_5 + pay2_0 + pay3_0;
                    const totalOtHours = ot1_0 + ot1_5 + ot2_0 + ot3_0;

                    const prevCumulativeOt = cumulativeOtSoFar;
                    cumulativeOtSoFar += totalOtHours;

                    const isExceeding80 = settings.enableOtWarning && (cumulativeOtSoFar > threshold);
                    const isDayCausingExceed = settings.enableOtWarning && (prevCumulativeOt < threshold && cumulativeOtSoFar >= threshold);

                    return {
                        ...item,
                        hrs,
                        ot1_0,
                        ot1_5,
                        ot2_0,
                        ot3_0,
                        pay1_0,
                        pay1_5,
                        pay2_0,
                        pay3_0,
                        totalOtPay,
                        totalOtHours,
                        runningCumulativeOt: cumulativeOtSoFar,
                        isExceeding80,
                        isDayCausingExceed
                    };
                });
            }, [cycleDates, workHours, hourlyRate, settings]);

            const summary = React.useMemo(() => {
                return dailyCalculations.reduce((acc, curr) => {
                    acc.hrs1_0 += curr.ot1_0;
                    acc.hrs1_5 += curr.ot1_5;
                    acc.hrs2_0 += curr.ot2_0;
                    acc.hrs3_0 += curr.ot3_0;

                    acc.pay1_0 += curr.pay1_0;
                    acc.pay1_5 += curr.pay1_5;
                    acc.pay2_0 += curr.pay2_0;
                    acc.pay3_0 += curr.pay3_0;

                    acc.totalOtHours += curr.totalOtHours;
                    acc.totalOtPay += curr.totalOtPay;
                    return acc;
                }, {
                    hrs1_0: 0, hrs1_5: 0, hrs2_0: 0, hrs3_0: 0,
                    pay1_0: 0, pay1_5: 0, pay2_0: 0, pay3_0: 0,
                    totalOtHours: 0, totalOtPay: 0
                });
            }, [dailyCalculations]);

            const thresholdLimit = parseFloat(settings.otWarningThreshold) || 80;

            React.useEffect(() => {
                if (settings.enableOtWarning && summary.totalOtHours > thresholdLimit) {
                    if (!hasTriggered80HrModal) {
                        setShow80HourWarningModal(true);
                        setHasTriggered80HrModal(true);
                    }
                } else {
                    if (hasTriggered80HrModal) {
                        setHasTriggered80HrModal(false);
                    }
                }
            }, [summary.totalOtHours, hasTriggered80HrModal, settings.enableOtWarning, thresholdLimit]);

            const showNotification = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleSetHours = (dateStr, val) => {
                if (val === '') {
                    setWorkHours(prev => ({
                        ...prev,
                        [dateStr]: ''
                    }));
                    return;
                }

                const parsed = Number(val);

                if (!Number.isFinite(parsed)) return;

                const next = Math.max(
                    0,
                    Math.min(24, Math.round(parsed * 2) / 2)
                );

                setWorkHours(prev => ({
                    ...prev,
                    [dateStr]: next
                }));
            };

            const handleStepHours = (dateStr, delta) => {
                setWorkHours(prev => {
                    const current = Number(prev[dateStr]) || 0;
                    const next = Math.max(
                        0,
                        Math.min(24, Math.round((current + delta) * 2) / 2)
                    );

                    return {
                        ...prev,
                        [dateStr]: next
                    };
                });
            };

            const fillDefaultWeekdays = (hours) => {
                const updated = { ...workHours };
                cycleDates.forEach(d => {
                    if (d.dayType === 'weekday') {
                        updated[d.dateStr] = hours;
                    }
                });
                setWorkHours(updated);
                showNotification(`กรอก ${hours} ชม. ในวันจันทร์-ศุกร์ เรียบร้อยแล้ว`);
            };

            const clearAllHours = () => {
                setWorkHours({});
                setHasTriggered80HrModal(false);
                showNotification('ล้างข้อมูลการทำงานทั้งหมดแล้ว');
            };

            const toggleHolidayDate = (dateStr) => {
                setCustomHolidays(prev => {
                    const next = { ...prev };
                    if (next[dateStr]) {
                        delete next[dateStr];
                    } else {
                        next[dateStr] = 'วันหยุดพิเศษ/นักขัตฤกษ์';
                    }
                    return next;
                });
            };

            const formatMoney = (amount) => {
                return amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            const formatHours = (hrs) => {
                if (!hrs) return '0';
                return Number.isInteger(hrs) ? hrs.toString() : hrs.toFixed(1);
            };

            const isTotalOtExceeded80 = settings.enableOtWarning && (summary.totalOtHours > thresholdLimit);

            return (
                <div className="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-6">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs sm:text-sm font-semibold border border-slate-700 animate-bounce flex items-center gap-2">
                            <span>✅</span> {toastMessage}

                                        <div className="grid grid-cols-2 gap-2 mt-2">
                                            <div>
                                                <span className="text-xs text-slate-500 block mb-1">วันเริ่มรอบ (เดือนก่อน)</span>
                                                <input 
                                                    type="number"
                                                    min="1"
                                                    max="31"
                                                    value={settings.cycleStartDay}
                                                    onChange={(e) => setSettings(prev => ({ ...prev, cycleStartDay: parseInt(e.target.value) || 1 }))}
                                                    className="w-full text-center font-bold border border-slate-300 rounded-xl bg-white py-1.5 outline-none focus:ring-2 focus:ring-indigo-500"
                                                />
                                            </div>
                                            <div>
                                                <span className="text-xs text-slate-500 block mb-1">วันสิ้นสุดรอบ (เดือนนี้)</span>
                                                <input 
                                                    type="number"
                                                    min="1"
                                                    max="31"
                                                    value={settings.cycleEndDay}
                                                    onChange={(e) => setSettings(prev => ({ ...prev, cycleEndDay: parseInt(e.target.value) || 31 }))}
                                                    className="w-full text-center font-bold border border-slate-300 rounded-xl bg-white py-1.5 outline-none focus:ring-2 focus:ring-indigo-500"
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    {/* OT Warning Limit */}
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="font-bold text-slate-800">
                                                ⚠️ เกณฑ์แจ้งเตือน OT สะสมเกินกำหนด
                                            </label>
                                            <input 
                                                type="checkbox"
                                                checked={settings.enableOtWarning}
                                                onChange={(e) => setSettings(prev => ({ ...prev, enableOtWarning: e.target.checked }))}
                                                className="w-4 h-4 accent-indigo-600 rounded cursor-pointer"
                                            />
                                        </div>
                                        <p className="text-xs text-slate-500 mb-2">แสดงการ์ดสีส้ม-แดงและป็อปอัพเตือนเมื่อสะสมเกินกำหนด</p>
                                        <div className="flex items-center gap-2">
                                            <input 
                                                type="number"
                                                disabled={!settings.enableOtWarning}
                                                value={settings.otWarningThreshold}
                                                onChange={(e) => setSettings(prev => ({ ...prev, otWarningThreshold: parseFloat(e.target.value) || 0 }))}
                                                className="flex-1 text-center font-extrabold text-rose-700 border border-slate-300 rounded-xl bg-white py-1.5 outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50"
                                            />
                                            <span className="font-bold text-slate-600">ชั่วโมง</span>
                                        </div>
                                    </div>

                                    {/* Quick Preset Buttons Settings */}
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                        <label className="block font-bold text-slate-800 mb-1">
                                            ⚡ ปรับแต่งปุ่มเลือกชั่วโมงด่วน 3 ปุ่ม
                                        </label>
                                        <div className="grid grid-cols-3 gap-2 mt-2">
                                            <div>
                                                <span className="text-[10px] text-slate-500 block mb-1">ปุ่มที่ 1</span>
                                                <input 
                                                    type="number"
                                                    step="0.5"
                                                    value={settings.preset1}
                                                    onChange={(e) => setSettings(prev => ({ ...prev, preset1: parseFloat(e.target.value) || 0 }))}
                                                    className="w-full text-center font-bold border border-slate-300 rounded-xl bg-white py-1 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <span className="text-[10px] text-slate-500 block mb-1">ปุ่มที่ 2</span>
                                                <input 
                                                    type="number"
                                                    step="0.5"
                                                    value={settings.preset2}
                                                    onChange={(e) => setSettings(prev => ({ ...prev, preset2: parseFloat(e.target.value) || 0 }))}
                                                    className="w-full text-center font-bold border border-slate-300 rounded-xl bg-white py-1 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <span className="text-[10px] text-slate-500 block mb-1">ปุ่มที่ 3</span>
                                                <input 
                                                    type="number"
                                                    step="0.5"
                                                    value={settings.preset3}
                                                    onChange={(e) => setSettings(prev => ({ ...prev, preset3: parseFloat(e.target.value) || 0 }))}
                                                    className="w-full text-center font-bold border border-slate-300 rounded-xl bg-white py-1 outline-none"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-3 bg-slate-100 border-t border-slate-200 text-right flex justify-between items-center">
                                    <button 
                                        onClick={() => setSettings(DEFAULT_SETTINGS)}
                                        className="text-xs font-semibold text-rose-600 hover:underline px-2"
                                    >
                                        รีเซ็ตเป็นค่าเริ่มต้น
                                    </button>
                                    <button 
                                        onClick={() => setShowSettingsModal(false)}
                                        className="px-5 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 transition active:scale-95"
                                    >
                                        บันทึกการตั้งค่า
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {show80HourWarningModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-3 z-50 animate-fade-in no-print">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border-2 border-rose-500 pulse-warning">
                                <div className="p-5 bg-gradient-to-r from-rose-600 to-orange-500 text-white text-center relative">
                                    <button 
                                        onClick={() => setShow80HourWarningModal(false)}
                                        className="absolute top-3 right-3 text-white/80 hover:text-white font-bold text-xl px-2"
                                    >
                                        ✕
                                    </button>
                                    <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-3xl mx-auto mb-2 shadow-inner">
                                        ⚠️
                                    </div>
                                    <h3 className="text-lg font-black tracking-wide">แจ้งเตือน: OT เกิน {thresholdLimit} ชั่วโมง!</h3>
                                    <p className="text-xs text-rose-100 mt-1">ยอดชั่วโมง OT สะสมประจำรอบเดือนนี้เกินเกณฑ์ {thresholdLimit} ชั่วโมงแล้ว</p>
                                </div>
                                
                                <div className="p-5 space-y-3 text-center">
                                    <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4">
                                        <div className="text-xs text-rose-600 font-semibold mb-1">ยอด OT รวมสะสมขณะนี้</div>
                                        <div className="text-3xl font-black text-rose-700 font-mono">
                                            {formatHours(summary.totalOtHours)} <span className="text-sm font-normal text-slate-600">ชั่วโมง</span>
                                        </div>
                                        <div className="text-xs font-bold text-orange-600 mt-1">
                                            (เกินเกณฑ์กำหนด {thresholdLimit} ชม. อยู่ +{formatHours(summary.totalOtHours - thresholdLimit)} ชม.)
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 bg-slate-50 border-t border-slate-200 text-center">
                                    <button 
                                        onClick={() => setShow80HourWarningModal(false)}
                                        className="w-full py-2.5 bg-gradient-to-r from-rose-600 to-orange-600 hover:from-rose-700 hover:to-orange-700 text-white font-bold text-sm rounded-xl shadow-md transition active:scale-95"
                                    >
                                        รับทราบและดำเนินการต่อ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {showHolidayModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 z-50 no-print">
                            <div className="bg-white rounded-2xl shadow-xl max-w-xl w-full max-h-[85vh] flex flex-col overflow-hidden">
                                <div className="p-4 bg-amber-50 border-b border-amber-200 flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <span className="text-lg">🟡</span>
                                        <h3 className="text-sm sm:text-base font-bold text-amber-900">จัดการวันหยุดนักขัตฤกษ์ ({selectedYear})</h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowHolidayModal(false)}
                                        className="text-slate-400 hover:text-slate-600 font-bold text-lg px-2"
                                    >
                                        ✕
                                    </button>
                                </div>
                                
                                <div className="p-4 overflow-y-auto space-y-2">
                                    <p className="text-xs text-slate-500 mb-2">
                                        รายการวันหยุดในระบบ คุณสามารถคลิกตั้งค่าวันหยุดเพิ่มเติมได้โดยตรงบนการ์ดปฏิทินของแต่ละปี
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                        {Object.entries(customHolidays).filter(([dateStr]) => dateStr.startsWith(selectedYear.toString())).map(([dateStr, name]) => (
                                            <div key={dateStr} className="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-200 text-xs">
                                                <div>
                                                    <span className="font-bold text-slate-800 mr-2">{dateStr}</span>
                                                    <span className="text-amber-800 font-medium">{name}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="p-3 bg-slate-50 border-t border-slate-200 text-right">
                                    <button 
                                        onClick={() => setShowHolidayModal(false)}
                                        className="px-4 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl hover:bg-indigo-700 transition"
                                    >
                                        ปิดหน้าต่าง
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {showPrintSlipModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-3 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-3xl w-full my-auto flex flex-col overflow-hidden">
                                <div className="p-4 bg-slate-800 text-white flex justify-between items-center no-print">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">🖨️</span>
                                        <h3 className="text-base font-bold">สรุปสลับสลิป OT ประจำรอบเดือน (พร้อมพิมพ์)</h3>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => window.print()}
                                            className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition"
                                        >
                                            🖨️ พิมพ์เอกสาร
                                        </button>
                                        <button 
                                            onClick={() => setShowPrintSlipModal(false)}
                                            className="text-white/80 hover:text-white font-bold text-xl px-2"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>

                                <div 
                                    id="ot-print-slip" 
                                    className="p-6 sm:p-8 space-y-6 text-slate-800 bg-white"
                                >
                                    {/* Statement Header */}
                                    <div className="border-b pb-4 flex justify-between items-start">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-900">เอกสารสรุปชั่วโมงการทำงานและการคำนวณ OT</h2>
                                            <p className="text-xs text-slate-500 mt-1">ประจำรอบเดือน {MONTH_NAMES_TH[selectedCycleMonth-1]} {selectedYear}</p>
                                        </div>
                                        <div className="text-right text-xs">
                                            <p className="font-bold text-slate-700">วันที่ออกเอกสาร: {new Date().toLocaleDateString('th-TH')}</p>
                                            <p className="text-slate-500">เงินเดือนพื้นฐาน: {salary.toLocaleString()} บาท</p>
                                        </div>
                                    </div>

                                    {/* Breakdown Table */}
                                    <table className="w-full text-xs text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 border-y border-slate-300 font-bold">
                                                <th className="py-2 px-2">รายการ OT</th>
                                                <th className="py-2 px-2 text-center">อัตราคูณ</th>
                                                <th className="py-2 px-2 text-right">จำนวนชั่วโมง</th>
                                                <th className="py-2 px-2 text-right">อัตรา (บาท/ชม.)</th>
                                                <th className="py-2 px-2 text-right">รวมเป็นเงิน (บาท)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            <tr>
                                                <td className="py-2 px-2 font-medium">OT 1.0x (ทำงานวันหยุดปกติ)</td>
                                                <td className="py-2 px-2 text-center font-mono">1.0×</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatHours(summary.hrs1_0)} ชม.</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatMoney(hourlyRate * 1.0)}</td>
                                                <td className="py-2 px-2 text-right font-mono font-bold">{formatMoney(summary.pay1_0)}</td>
                                            </tr>
                                            <tr>
                                                <td className="py-2 px-2 font-medium">OT 1.5x (ล่วงเวลาวันทำงานปกติ)</td>
                                                <td className="py-2 px-2 text-center font-mono">1.5×</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatHours(summary.hrs1_5)} ชม.</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatMoney(hourlyRate * 1.5)}</td>
                                                <td className="py-2 px-2 text-right font-mono font-bold">{formatMoney(summary.pay1_5)}</td>
                                            </tr>
                                            <tr>
                                                <td className="py-2 px-2 font-medium">OT 2.0x (ทำงานวันหยุดนักขัตฤกษ์)</td>
                                                <td className="py-2 px-2 text-center font-mono">2.0×</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatHours(summary.hrs2_0)} ชม.</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatMoney(hourlyRate * 2.0)}</td>
                                                <td className="py-2 px-2 text-right font-mono font-bold">{formatMoney(summary.pay2_0)}</td>
                                            </tr>
                                            <tr>
                                                <td className="py-2 px-2 font-medium">OT 3.0x (ล่วงเวลาวันหยุด)</td>
                                                <td className="py-2 px-2 text-center font-mono">3.0×</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatHours(summary.hrs3_0)} ชม.</td>
                                                <td className="py-2 px-2 text-right font-mono">{formatMoney(hourlyRate * 3.0)}</td>
                                                <td className="py-2 px-2 text-right font-mono font-bold">{formatMoney(summary.pay3_0)}</td>
                                            </tr>
                                        </tbody>
                                        <tfoot>
                                            <tr className="bg-slate-100 border-t-2 border-slate-400 font-bold text-sm">
                                                <td colSpan="2" className="py-3 px-2 text-slate-900">รวมค่า OT ทั้งสิ้นประจำรอบเดือน:</td>
                                                <td className="py-3 px-2 text-right font-mono text-indigo-700">{formatHours(summary.totalOtHours)} ชม.</td>
                                                <td colSpan="2" className="py-3 px-2 text-right font-mono text-indigo-900 font-black text-base">
                                                    {formatMoney(summary.totalOtPay)} บาท
                                                </td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <footer className="mt-6 text-center text-xs text-slate-400 no-print border-t border-slate-200 pt-3">
                        <p>ปฏิทินคำนวณ OT ปี {selectedYear} • ฐานทำงานปกติ {settings.baseDailyHours} ชม./วัน • หาร {settings.daysInMonth} วัน/เดือน • บันทึกอัตโนมัติ</p>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<OTCalculatorApp />);
    </script>
</body>
</html>
